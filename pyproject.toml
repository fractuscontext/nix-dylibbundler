[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nix-dylibbundler"
version = "0.1.0"
description = "macOS Native Dylib Bundler for Nix store libraries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.0.1",
    "typer>=0.24.0",
]

[project.scripts]
# This creates the terminal command you will type
nix-dylibbundler = "nix_dylibbundler.cli:app"
